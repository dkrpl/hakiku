  <rect x="16" y="16" width="608" height="408" rx="22" fill="#E6F2FA" stroke="#14261C" stroke-width="4" />

  <g clip-path="url(#mapFrame)">
    <!-- Sky upper wash -->
    <rect x="16" y="16" width="608" height="190" fill="#D4EBFA" />

