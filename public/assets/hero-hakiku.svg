    <circle cx="536" cy="84" r="34" fill="#F2B705" stroke="#14261C" stroke-width="3" />
    <g stroke="#14261C" stroke-width="3" stroke-linecap="round">
      <line x1="536" y1="36" x2="536" y2="44" />
      <line x1="536" y1="124" x2="536" y2="132" />
      <line x1="488" y1="84" x2="496" y2="84" />
      <line x1="576" y1="84" x2="584" y2="84" />
      <line x1="502" y1="50" x2="508" y2="56" />
      <line x1="564" y1="112" x2="570" y2="118" />
      <line x1="570" y1="50" x2="564" y2="56" />
      <line x1="508" y1="112" x2="502" y2="118" />
    </g>

    <!-- Storybook clouds -->
    <g fill="#FFFFFF" stroke="#14261C" stroke-width="2.5">
      <path d="M74 86c0-11 9-20 20-20 3-12 14-21 27-21 15 0 27 11 28 25 10 1 17 9 17 19 0 10-8 18-18 18H92c-10 0-18-9-18-21Z" />
      <path d="M312 70c0-8 7-15 15-15 3-9 11-15 21-15 11 0 20 8 21 18 7 1 13 7 13 14 0 8-6 14-14 14h-42c-8 0-14-7-14-16Z" />
    </g>

