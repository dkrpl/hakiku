    <g transform="translate(36 128)">
      <rect x="3" y="4" width="174" height="58" rx="14" fill="#14261C" />
      <rect x="0" y="0" width="174" height="58" rx="14" fill="#FFFFFF" stroke="#14261C" stroke-width="3" />
      <!-- Golden key icon -->
      <circle cx="30" cy="29" r="12" fill="#F2B705" stroke="#14261C" stroke-width="2.5" />
      <circle cx="30" cy="29" r="4" fill="#FFFFFF" stroke="#14261C" stroke-width="2" />
      <path d="M42 29 H64 M56 29 V36 M62 29 V35" stroke="#14261C" stroke-width="3" stroke-linecap="round" />
      <text x="74" y="26" font-family="Trebuchet MS, sans-serif" font-weight="800" font-size="14" fill="#14261C">5 RUANG</text>
      <text x="74" y="44" font-family="Trebuchet MS, sans-serif" font-weight="700" font-size="12" fill="#186A42">BUKA GEMBOK</text>
