      <path d="M10 44 L43 18 L76 44 Z" fill="#186A42" stroke="#14261C" stroke-width="3" stroke-linejoin="round" />
      <rect x="26" y="50" width="14" height="18" rx="2" fill="#FFFFFF" stroke="#14261C" stroke-width="2" />
      <rect x="46" y="50" width="14" height="18" rx="2" fill="#FEF5D6" stroke="#14261C" stroke-width="2" />
