    <!-- Foreground rolling meadow -->
    <path d="M16 252 Q170 206 320 246 T624 234 L624 424 L16 424 Z" fill="#2E9E5B" stroke="#14261C" stroke-width="3" />

    <!-- Winding blue river across right meadow -->
    <path d="M412 238 C388 286 452 324 424 424 L476 424 C500 326 436 286 456 238 Z" fill="#3698D8" stroke="#14261C" stroke-width="3" />

