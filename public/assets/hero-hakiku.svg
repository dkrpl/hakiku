<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Peta petualangan buku cerita HAKIKU dengan lima pos belajar dari gerbang desa hingga menara tantangan">
  <defs>
    <clipPath id="mapFrame">
      <rect x="16" y="16" width="608" height="408" rx="22" />
    </clipPath>
  </defs>

  <!-- Outer storybook frame shadow and border -->
