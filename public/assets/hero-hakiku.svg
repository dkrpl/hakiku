      <rect x="26" y="48" width="32" height="16" rx="2" fill="#FFFFFF" stroke="#14261C" stroke-width="2" />
      <line x1="32" y1="54" x2="52" y2="54" stroke="#186A42" stroke-width="2.5" stroke-linecap="round" />
      <line x1="32" y1="60" x2="46" y2="60" stroke="#155E95" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="74" cy="70" r="13" fill="#186A42" stroke="#14261C" stroke-width="2.5" />
      <text x="74" y="75" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">3</text>
