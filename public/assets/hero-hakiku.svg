    <path d="M88 362 C110 292 174 286 218 320 C264 354 316 348 342 288 C366 234 456 264 514 294 C554 314 562 246 532 204" fill="none" stroke="#14261C" stroke-width="28" stroke-linecap="round" />
    <path d="M88 362 C110 292 174 286 218 320 C264 354 316 348 342 288 C366 234 456 264 514 294 C554 314 562 246 532 204" fill="none" stroke="#FEF5D6" stroke-width="22" stroke-linecap="round" />
    <path d="M88 362 C110 292 174 286 218 320 C264 354 316 348 342 288 C366 234 456 264 514 294 C554 314 562 246 532 204" fill="none" stroke="#C99000" stroke-width="3" stroke-dasharray="10 10" stroke-linecap="round" />

