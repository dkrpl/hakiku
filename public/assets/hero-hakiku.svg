      <polygon points="12,38 40,8 68,38" fill="#186A42" stroke="#14261C" stroke-width="3" stroke-linejoin="round" />
      <line x1="40" y1="8" x2="40" y2="-8" stroke="#14261C" stroke-width="3" stroke-linecap="round" />
      <polygon points="40,-8 64,0 40,8" fill="#F2B705" stroke="#14261C" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M31 102 V76 A9 9 0 0 1 49 76 V102 Z" fill="#F2B705" stroke="#14261C" stroke-width="2.5" />
