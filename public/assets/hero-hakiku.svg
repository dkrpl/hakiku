      <circle cx="64" cy="94" r="14" fill="#F2B705" stroke="#14261C" stroke-width="2.5" />
      <text x="64" y="99" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-weight="800" font-size="14" fill="#14261C">5</text>
