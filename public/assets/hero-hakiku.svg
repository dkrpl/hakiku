    <g transform="translate(52 276)">
      <rect x="8" y="34" width="68" height="46" rx="4" fill="#FBF8F1" stroke="#14261C" stroke-width="3" />
      <polygon points="2,38 42,8 82,38" fill="#155E95" stroke="#14261C" stroke-width="3" stroke-linejoin="round" />
      <rect x="33" y="52" width="18" height="28" rx="3" fill="#F2B705" stroke="#14261C" stroke-width="2.5" />
      <rect x="16" y="46" width="11" height="12" rx="2" fill="#E6F2FA" stroke="#14261C" stroke-width="2" />
      <rect x="57" y="46" width="11" height="12" rx="2" fill="#E6F2FA" stroke="#14261C" stroke-width="2" />
      <circle cx="42" cy="24" r="5" fill="#F2B705" stroke="#14261C" stroke-width="2" />
