    <!-- Storybook trees -->
    <g stroke="#14261C" stroke-width="2.5">
      <rect x="150" y="352" width="10" height="22" fill="#7A4D00" />
      <circle cx="155" cy="342" r="18" fill="#186A42" />

      <rect x="282" y="366" width="10" height="20" fill="#7A4D00" />
      <circle cx="287" cy="356" r="16" fill="#186A42" />

      <rect x="572" y="316" width="10" height="24" fill="#7A4D00" />
      <circle cx="577" cy="304" r="19" fill="#186A42" />
